name: devsecops-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}
  MIN_SCORE: "4.0"     # o'tish chegarasi (5 dan)

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect --source /repo -v --redact --no-banner \
            --report-format json --report-path /repo/gitleaks.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-secrets
          path: gitleaks.json
          if-no-files-found: ignore

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit
        run: |
          pip install bandit
          bandit -r app -f json -o bandit.json || [ $? -eq 1 ]
      - name: Semgrep
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/flask --config p/secrets \
            --json-output=semgrep.json --sarif-output=semgrep.sarif app/
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-sast
          path: |
            bandit.json
            semgrep.json
          if-no-files-found: ignore

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt --no-deps --disable-pip \
            -f json -o pip-audit.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-sca
          path: pip-audit.json
          if-no-files-found: ignore

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: |
          docker run --rm -i hadolint/hadolint hadolint -f json - < Dockerfile > hadolint.json || [ $? -eq 1 ]
      - name: Trivy config (Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config.json
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-dockerfile
          path: |
            hadolint.json
            trivy-config.json
          if-no-files-found: ignore

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Trivy SARIF (Security tab uchun)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json

      - name: Run app for DAST
        run: |
          docker run -d --name app -p 127.0.0.1:5000:5000 $IMAGE:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:5000/user && break
            sleep 2
          done
          docker logs app

      - name: ZAP baseline (passiv DAST)
        run: |
          chmod 777 "$PWD"
          docker run --rm --network host -v "$PWD":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://127.0.0.1:5000/user?name=test" \
            -r zap-report.html -I

      - name: Trivy image (JSON hisobot)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: json
          output: trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-image
          path: |
            trivy-image.json
            zap-report.html
          if-no-files-found: ignore

  report:
    needs: [secrets, sast, sca, dockerfile, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports

      - name: Build report (reyting + PDF)
        env:
          STATUS_SECRETS: ${{ needs.secrets.result }}
          STATUS_SAST: ${{ needs.sast.result }}
          STATUS_SCA: ${{ needs.sca.result }}
          STATUS_DOCKERFILE: ${{ needs.dockerfile.result }}
          STATUS_IMAGE: ${{ needs.image-scan.result }}
        run: |
          python3 scripts/make_report.py
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=security-report.pdf "file://$PWD/security-report.html"
          ls -la security-report.*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            security-report.pdf
            reports/

      - name: Quality gate
        run: |
          source gate.env
          echo "Umumiy reyting: $SCORE / 5 (minimum: $MIN_SCORE)"
          [ "$PASSED" = "true" ]

  publish:   # faqat reyting o'tgandan keyin va faqat main'da
    needs: [report]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push $IMAGE:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: |
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }})
          cosign sign --yes "$REF"
